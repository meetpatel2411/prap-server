name: Deploy PRAP to AWS EC2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Automated Tests & Rule Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Execute Pytest Suite
        run: |
          pytest -v tests/

  deploy:
    name: Deploy to EC2 Production Instance
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Ubuntu EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Updating PRAP on EC2 instance..."
            cd /home/ubuntu/prap
            
            # Pull latest code
            git pull origin main || git pull origin master
            
            # Update virtual environment
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Restart Gunicorn service
            sudo systemctl restart prap
            
            # Reload Nginx reverse proxy
            sudo systemctl reload nginx
            
            # Check systemd status
            sudo systemctl is-active --quiet prap && echo "✅ PRAP Service is active and healthy!" || exit 1
